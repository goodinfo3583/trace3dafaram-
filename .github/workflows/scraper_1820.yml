name: Evening Stock Scraper (18:20)

on:
  schedule:
    # 台灣時間 18:20 = UTC 時間 10:20
    # 執行時間：星期一到星期五 (1-5)
    - cron: '20 10 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查並複製專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝執行爬蟲所需的套件
      run: |
        python -m pip install --upgrade pip
        # 你的新程式多用到了 requests 和 bs4(beautifulsoup4)，記得在這裡補上安裝
        pip install pandas selenium lxml html5lib requests beautifulsoup4

    - name: 執行 18:20 Python 爬蟲程式
      run: |
        # ⚠️ 請確保這裡的檔名跟你剛剛存檔的 Python 檔名一模一樣
        python "daily1820_scraper.py" 

    - name: 自動將更新的 CSV 資料推回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Goodinfo_Rankings/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新 18:20 籌碼資料 $(date +'%Y-%m-%d')" && git push)
