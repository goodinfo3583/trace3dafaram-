name: Daily Stock Scraper

on:
  schedule:
    # 台灣時間每天下午 22:10 執行
    - cron: '5 14 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查並複製專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝執行爬蟲所需的套件
      run: |
        python -m pip install --upgrade pip
        pip install pandas selenium lxml html5lib

    - name: 執行 Python 爬蟲程式
      run: |
        # ⚠️ 下面這行，請務必把 main.py 換成你真正的 Python 檔名！
        # 例如你的檔案叫 spider.py，就改成 python spider.py
        python "newdaily2200_scraper.py" 

    - name: 自動將更新的 CSV 資料推回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Goodinfo_Rankings/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新籌碼資料 $(date +'%Y-%m-%d')" && git push)
