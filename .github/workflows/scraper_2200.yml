name: Night Stock Scraper (22:05)

on:
  schedule:
    # 台灣時間 22:05 = UTC 時間 14:05
    - cron: '5 14 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Taipei

    steps:
    - name: 檢查並複製專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 🌟 升級點 1：安裝 xvfb 虛擬螢幕套件
    - name: 安裝執行爬蟲所需的套件與虛擬顯示器
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        python -m pip install --upgrade pip
        pip install pandas selenium lxml html5lib requests beautifulsoup4 undetected-chromedriver

    # 🌟 升級點 2：使用 xvfb-run 啟動 Python，並執行 22:00 的爬蟲
    - name: 執行 Python 爬蟲程式
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python "newdaily2200_scraper.py" 
    # ========================================================
    # 🌟 2-1核心新增步驟：爬蟲完立刻呼叫雷達程式，把熱騰騰的資料算成精華 JSON
    # ========================================================
    - name: 執行主力囤貨雷達分析
      run: |
        python "find_smart_money.py"
      continue-on-error: true # 萬一某天券商檔案有髒資料，不至於讓整個工作流卡死

    - name: 更新遠端進度 (避免衝突)
      run: |
        git pull --rebase --autostash origin main

    - name: 自動將更新的 CSV 與 主力 JSON 資料推回 GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "自動更新 22:05 籌碼與主力囤貨JSON"
        # 修改這裡，讓它同時允許儲存 CSV 與 docs 資料夾底下的 JSON
        file_pattern: 'Goodinfo_Rankings/* docs/data/*'
    # 🌟 升級點 3：推播前自動同步 GitHub 最新狀態，防止衝突
    - name: 更新遠端進度 (避免衝突)
      run: |
        git pull --rebase --autostash origin main

    - name: 自動將更新的 CSV 資料推回 GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "自動更新 22:05 籌碼資料"
        file_pattern: 'Goodinfo_Rankings/*'
